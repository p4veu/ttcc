name: Build TTCC module

on:
  push:
    branches: [main, feature/ttcc-chapters, feature/ttcc-chapters-ui, feature/ttcc-seek-preview]
    paths:
      - build_patch.py
      - chapter_patch.py
      - ttcc_chapters.js
      - test_chapters.mjs
      - .github/workflows/build-ttcc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TTCC
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch clean TizenTube 1.15.0 source
        run: |
          git clone https://github.com/reisxd/TizenTube.git upstream
          cd upstream
          git checkout 893b663d35efa558d8bdf9f54f0c4f9a31ab6a07
          test "$(node -p "require('./package.json').version")" = "1.15.0"

      - name: Apply TTCC patch
        run: python3 build_patch.py upstream

      - name: Apply chapter patch
        run: python3 chapter_patch.py upstream

      - name: Test chapter extraction
        run: node test_chapters.mjs

      - name: Build userscript
        working-directory: upstream/mods
        run: |
          npm ci
          npm run build

      - name: Build DIAL service
        working-directory: upstream/service
        run: |
          npm ci
          npx rollup -c rollup.config.js

      - name: Prepare module files
        run: |
          mkdir -p dist
          cp upstream/dist/userScript.js dist/userScript.js
          cp upstream/dist/service.js dist/service.js
          cp upstream/LICENSE LICENSE
          cat > package.json <<'EOF'
          {
            "name": "ttcc",
            "appName": "TizenTube HA Search TEST",
            "version": "1.15.0-ttcc.17-resume-paused",
            "description": "TEST ONLY: HA bridge and chapter markers; queries YouTube once per video if needed.",
            "packageType": "mods",
            "websiteURL": "https://youtube.com/tv?additionalDataUrl=http%3A%2F%2Flocalhost%3A8085%2Fdial%2Fapps%2FYouTube",
            "main": "dist/userScript.js",
            "author": "Reis Can; TTCC patch",
            "serviceFile": "dist/service.js",
            "keys": [
              "MediaPlayPause",
              "MediaPlay",
              "MediaPause",
              "MediaStop",
              "MediaFastForward",
              "MediaRewind",
              "MediaTrackNext",
              "MediaTrackPrevious"
            ],
            "repository": {
              "url": "https://github.com/p4veu/ttcc"
            },
            "license": "GPL-3.0-only"
          }
          EOF
          cat > README.md <<'EOF'
          # TTCC

          Custom TizenBrew module built from the clean TizenTube 1.15.0 source
          (upstream commit 893b663d35efa558d8bdf9f54f0c4f9a31ab6a07).

          Changes:
          - direct "Turn off screen / Wyłącz ekran" player button;
          - safe wake-up: the first non-media remote-key sequence only restores the picture;
          - Play/Pause keeps controlling playback while Screen Off stays black, including Samsung trailing key events;
          - blackout uses an html pseudo-element so resuming playback cannot remove it during a YouTube UI rerender;
          - no global display:block restore, preventing Theme Configuration from appearing on wake;
          - DIAL/casting launches gh/p4veu/ttcc rather than the upstream npm module.
          - TEST: POST /ttcc/search on local port 8096 to show HA voice search results.
          - Visibility diagnostics: /ttcc/status reports hidden, focused and visibilityState from the TV page.
          - TEST: POST /ttcc/screen supports voice screen on/off via the same HA bridge.
          - TEST: POST /ttcc/search accepts auto_screen_off=true to darken after a selected film starts playing.
          - TEST: POST /ttcc/playlist opens a playlist by playlist_id and attempts to start playback.
          - TEST: Chapter markers and the selected chapter name appear on the playback bar; one fallback metadata request per video.
          - Chapter overlay stays outside YouTube's frequently rebuilt progress-bar DOM.
          - Chapter title tracks the preview clock while seeking before the position is confirmed.
          - Screen Off is first in native engagement actions; empty native action rows remain untouched.
          - TEST: pause video when the app is hidden; retry on return and refresh a stalled player once.
          - TEST: resume paused videos even when Tizen paused them before hiding; use TV watch ID fallback and report recovery stage in /ttcc/status.
          - Previous confirmed-working version .5 is preserved on stable-fully-working-ttcc-1.15.0-ttcc.5 branch.

          Upstream: https://github.com/reisxd/TizenTube
          License: GPL-3.0-only
          EOF

      - name: Verify built module
        run: |
          test -s dist/userScript.js
          test -s dist/service.js
          grep -q "TRANSPORT_CONTROLS_BUTTON_TYPE_TURN_OFF_SCREEN" dist/userScript.js
          grep -q "data-ttcc-screen-off" dist/userScript.js
          grep -q "10252" dist/userScript.js
          grep -q "TRANSPORT_CONTROLS_BUTTON_TYPE_TURN_OFF_SCREEN" dist/userScript.js
          grep -q "p4veu/ttcc" dist/service.js
          grep -q "ttcc/search" dist/service.js
          grep -q "ttcc/next" dist/service.js
          grep -q "ttcc/screen" dist/service.js
          grep -q "ttcc/playlist" dist/service.js
          grep -q "auto_screen_off" dist/service.js
          grep -q "ttcc-chapters" dist/userScript.js
          grep -q "chapterCount" dist/service.js
          grep -q "8096" dist/userScript.js
          grep -q "playback stalled after resume" dist/userScript.js
          grep -q '"main": "dist/userScript.js"' package.json
          grep -q '"serviceFile": "dist/service.js"' package.json

      - name: Upload test module
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ttcc-chapters-test
          path: |
            dist/
            package.json
            README.md
            LICENSE

      - name: Commit generated module
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist package.json LICENSE README.md
          if ! git diff --cached --quiet; then
            git commit -m "build: TTCC 1.15.0-ttcc.17-resume-paused"
            git push
          fi

      - name: Purge jsDelivr cache
        if: github.ref == 'refs/heads/main'
        run: |
          for path in package.json dist/userScript.js dist/service.js; do
            for ref in "" "@main" "@latest"; do
              echo "Purging ${path} ${ref}"
              curl --fail --silent --show-error --retry 3 "https://purge.jsdelivr.net/gh/p4veu/ttcc${ref}/${path}"
              echo
            done
          done

      - name: Verify jsDelivr serves current version
        if: github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 60); do
            body="$(curl --fail --silent --show-error "https://cdn.jsdelivr.net/gh/p4veu/ttcc/package.json" || true)"
            echo "$body"
            if echo "$body" | grep -q '"version": "1.15.0-ttcc.17-resume-paused"'; then
              echo "jsDelivr is fresh."
              exit 0
            fi
            echo "Still stale; retry $i/60..."
            sleep 5
          done
          echo "jsDelivr still serves stale metadata."
          exit 1

