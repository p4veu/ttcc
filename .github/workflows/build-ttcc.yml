name: Build TTCC module

on:
  push:
    branches: [main, ttcc-23-release, fix/ttcc-late-injection-retry, fix/ttcc-first-startup-v25, fix/ttcc-document-start-injection-v26, feature/ttcc-chapters, feature/ttcc-chapters-ui, feature/ttcc-seek-preview]
    paths:
      - build_patch.py
      - chapter_patch.py
      - ttcc_chapters.js
      - test_chapters.mjs
      - .github/workflows/build-ttcc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TTCC
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch clean TizenTube 1.15.0 source
        run: |
          git clone https://github.com/reisxd/TizenTube.git upstream
          cd upstream
          git checkout 893b663d35efa558d8bdf9f54f0c4f9a31ab6a07
          test "$(node -p "require('./package.json').version")" = "1.15.0"

      - name: Apply TTCC patch
        run: python3 build_patch.py upstream

      - name: Apply chapter patch
        run: python3 chapter_patch.py upstream

      - name: Test chapter extraction
        run: node test_chapters.mjs

      - name: Build userscript
        working-directory: upstream/mods
        run: |
          npm ci
          npm run build

      - name: Test TizenBrew early-injection regression
        working-directory: upstream/mods
        run: node --test tests/*.test.js

      - name: Build DIAL service
        working-directory: upstream/service
        run: |
          npm ci
          npx rollup -c rollup.config.js

      - name: Prepare module files
        run: |
          mkdir -p dist
          cp upstream/dist/userScript.js dist/userScript.js
          cp upstream/dist/userScript.js dist/userScript.v26-document-start.js
          cp upstream/dist/service.js dist/service.js
          cp upstream/dist/service.js dist/service.v26-document-start.js
          cp upstream/LICENSE LICENSE
          cat > package.json <<'EOF'
          {
            "name": "ttcc",
            "appName": "TizenTube AutoRecover .26",
            "version": "1.15.4",
            "description": "TizenTube with playback recovery after TV standby and app switching.",
            "packageType": "mods",
            "websiteURL": "https://youtube.com/tv?additionalDataUrl=http%3A%2F%2Flocalhost%3A8096%2Fdial%2Fapps%2FYouTube",
            "main": "dist/userScript.v26-document-start.js",
            "evaluateScriptOnDocumentStart": true,
            "author": "Reis Can; TTCC patch",
            "serviceFile": "dist/service.v26-document-start.js",
            "keys": [
              "MediaPlayPause",
              "MediaPlay",
              "MediaPause",
              "MediaStop",
              "MediaFastForward",
              "MediaRewind",
              "MediaTrackNext",
              "MediaTrackPrevious"
            ],
            "repository": {
              "url": "https://github.com/p4veu/ttcc"
            },
            "license": "GPL-3.0-only"
          }
          EOF
          cat > README.md <<'EOF'
          # TTCC

          Custom TizenBrew module built from the clean TizenTube 1.15.0 source
          (upstream commit 893b663d35efa558d8bdf9f54f0c4f9a31ab6a07).

          Changes:
          - TizenBrew early-injection protection from TizenTube PR #759: defer DOM-dependent startup, wait for PiP services, and guard missing/malformed account-action data; includes startup regression tests.
          - TizenBrew Document Start injection enabled in the module manifest, so the userscript is registered before YouTube initializes; the one-time reload guard remains a fallback.
          - direct "Turn off screen / Wyłącz ekran" player button;
          - safe wake-up: the first non-media remote-key sequence only restores the picture;
          - Play/Pause keeps controlling playback while Screen Off stays black, including Samsung trailing key events;
          - blackout uses an html pseudo-element so resuming playback cannot remove it during a YouTube UI rerender;
          - no global display:block restore, preventing Theme Configuration from appearing on wake;
          - DIAL/casting launches the version-specific gh/p4veu/ttcc@ttcc-23-release module.
          - TEST: POST /ttcc/search on local port 8096 to show HA voice search results.
          - Visibility diagnostics: /ttcc/status reports hidden, focused and visibilityState from the TV page.
          - TEST: POST /ttcc/screen supports voice screen on/off via the same HA bridge.
          - TEST: POST /ttcc/search accepts auto_screen_off=true to darken after a selected film starts playing.
          - TEST: POST /ttcc/playlist opens a playlist by playlist_id and attempts to start playback.
          - TEST: Chapter markers and the selected chapter name appear on the playback bar; one fallback metadata request per video.
          - Chapter overlay stays outside YouTube's frequently rebuilt progress-bar DOM.
          - Chapter title tracks the preview clock while seeking before the position is confirmed.
          - Screen Off is first in native engagement actions; empty native action rows remain untouched.
          - AutoRecover: detect system-paused playback and app returns when Tizen omits visibilitychange; retry or refresh a stalled player once.
          - AutoRecover: preserve the video and its position after the TV suspends playback, with extra focus and pause-event detection.
          - No startup autoplay: normal browsing or pausing never persists or reopens the last video.
          - AutoRecover remains limited to recovery after a detected app return or genuinely stalled playback.
          - TEST: add Screen Off only after YouTube has a native rendered action; keep loading rows free of synthetic controls.
          - Previous confirmed-working version .5 is preserved on stable-fully-working-ttcc-1.15.0-ttcc.5 branch.

          Upstream: https://github.com/reisxd/TizenTube
          License: GPL-3.0-only
          EOF

      - name: Verify built module
        run: |
          test -s dist/userScript.js
          test -s dist/userScript.v26-document-start.js
          test -s dist/service.js
          test -s dist/service.v26-document-start.js
          grep -q "TRANSPORT_CONTROLS_BUTTON_TYPE_TURN_OFF_SCREEN" dist/userScript.js
          grep -q "data-ttcc-screen-off" dist/userScript.js
          grep -q "10252" dist/userScript.js
          grep -q "TRANSPORT_CONTROLS_BUTTON_TYPE_TURN_OFF_SCREEN" dist/userScript.js
          grep -q "p4veu/ttcc" dist/service.js
          grep -q "ttcc/search" dist/service.js
          grep -q "ttcc/next" dist/service.js
          grep -q "ttcc/screen" dist/service.js
          grep -q "ttcc/playlist" dist/service.js
          grep -q "auto_screen_off" dist/service.js
          grep -q "ttcc-chapters" dist/userScript.js
          grep -q "chapterCount" dist/service.js
          grep -q "8096" dist/userScript.js
          grep -q "playback stalled after app resume" dist/userScript.js
          grep -q "__ttcc_startup_retry_v1" dist/userScript.js
          grep -q "TTCC_STARTUP_RELOAD_ONCE" dist/userScript.js
          ! grep -q "__ttcc_last_active_playback" dist/userScript.v26-document-start.js
          ! grep -q "startup-stale-session" dist/userScript.v26-document-start.js
          grep -q "standby-reload-wait" dist/userScript.v26-document-start.js
          grep -q "focus-paused-detected" dist/userScript.v26-document-start.js
          grep -q "watchdog-return-detected" dist/userScript.v26-document-start.js
          grep -q "pause-candidate" dist/userScript.v26-document-start.js
          grep -q '"main": "dist/userScript.v26-document-start.js"' package.json
          grep -q '"serviceFile": "dist/service.v26-document-start.js"' package.json
          grep -q '"evaluateScriptOnDocumentStart": true' package.json
          grep -q 'localhost%3A8096' package.json
          grep -q '"version": "1.15.4"' package.json

      - name: Upload test module
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ttcc-startup-fix-test
          path: |
            dist/
            package.json
            README.md
            LICENSE

      - name: Commit generated module
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ttcc-23-release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist package.json LICENSE README.md
          if ! git diff --cached --quiet; then
            git commit -m "build: TTCC 1.15.4 (.25 startup retry)"
            git push
          fi

      - name: Publish .26 semver tag for the unchanged TizenBrew module URL
        if: github.ref == 'refs/heads/main'
        run: |
          version="$(node -p "require('./package.json').version")"
          # Use a new semver version: jsDelivr keeps the old 1.15.0 package cached.
          test "$version" = "1.15.4"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists; keeping the immutable release tag."
          else
            git tag "$version" HEAD
            git push origin "refs/tags/$version"
          fi

      - name: Purge TizenBrew manifest aliases and .26 assets
        if: github.ref == 'refs/heads/main'
        run: |
          # Invalidate the unversioned TizenBrew URL plus jsDelivr's latest/stable
          # semver resolution and the immutable .26 paths. Purging only package.json
          # at the unversioned path left jsDelivr serving the previous manifest.
          for path in \
            "gh/p4veu/ttcc/package.json" \
            "gh/p4veu/ttcc@latest/package.json" \
            "gh/p4veu/ttcc@1.15.4/package.json" \
            "gh/p4veu/ttcc/dist/userScript.v26-document-start.js" \
            "gh/p4veu/ttcc/dist/service.v26-document-start.js" \
            "gh/p4veu/ttcc@1.15.4/dist/userScript.v26-document-start.js" \
            "gh/p4veu/ttcc@1.15.4/dist/service.v26-document-start.js"; do
            response="$(curl --fail --silent --show-error --retry 3 "https://purge.jsdelivr.net/${path}")"
            echo "${path}: ${response}"
            echo "${response}" | grep -q '"throttled": false'
          done

      - name: Verify jsDelivr serves TTCC .23 release alias
        if: github.ref == 'refs/heads/ttcc-23-release'
        run: |
          base="https://cdn.jsdelivr.net/gh/p4veu/ttcc@ttcc-23-release"
          echo "Checking TizenBrew module URL: ${base}"
          for i in $(seq 1 60); do
            body="$(curl --fail --silent --show-error "${base}/package.json" || true)"
            echo "$body"
            script="$(curl --fail --silent --show-error "${base}/dist/userScript.v23-no-startup-autoplay.js" || true)"
            service="$(curl --fail --silent --show-error "${base}/dist/service.v23-no-startup-autoplay.js" || true)"
            if echo "$body" | grep -q '"main": "dist/userScript.v23-no-startup-autoplay.js"' && echo "$body" | grep -q '"serviceFile": "dist/service.v23-no-startup-autoplay.js"' && echo "$body" | grep -q '"version": "1.15.0-ttcc.23-no-startup-autoplay"' && [[ "$script" == *standby-reload-wait* ]] && [[ "$script" == *focus-paused-detected* ]] && [[ "$script" == *pause-candidate* ]] && [[ "$script" != *startup-stale-session* ]] && [[ "$service" == *"p4veu/ttcc@ttcc-23-release"* ]]; then
              echo "TTCC .23 release alias is verified."
              exit 0
            fi
            echo "Release alias not ready; retry $i/60..."
            sleep 5
          done
          echo "The release alias did not return the expected .23 module."
          exit 1

      - name: Verify existing TizenBrew module URL serves .26
        if: github.ref == 'refs/heads/main'
        run: |
          base="https://cdn.jsdelivr.net/gh/p4veu/ttcc"
          echo "Checking unchanged TizenBrew module URL: ${base}"
          for i in $(seq 1 60); do
            body="$(curl --fail --silent --show-error "${base}/package.json" || true)"
            echo "$body"
            script="$(curl --fail --silent --show-error "${base}/dist/userScript.v26-document-start.js" || true)"
            service="$(curl --fail --silent --show-error "${base}/dist/service.v26-document-start.js" || true)"
            if echo "$body" | grep -q '"main": "dist/userScript.v26-document-start.js"' && echo "$body" | grep -q '"serviceFile": "dist/service.v26-document-start.js"' && echo "$body" | grep -q '"version": "1.15.4"' && [[ "$script" == *standby-reload-wait* ]] && [[ "$script" == *focus-paused-detected* ]] && [[ "$script" == *pause-candidate* ]] && [[ "$script" != *startup-stale-session* ]] && [[ "$service" == *1.15.4* ]] && [[ "$service" == *"p4veu/ttcc"* ]]; then
              echo "Existing TizenBrew module URL now serves .26."
              exit 0
            fi
            echo "Existing module URL still stale; retry $i/60..."
            sleep 5
          done
          echo "The unchanged TizenBrew module URL still does not serve .25."
          exit 1

      - name: Verify jsDelivr serves pinned release
        if: github.ref == 'refs/heads/main'
        run: |
          version="$(node -p "require('./package.json').version")"
          base="https://cdn.jsdelivr.net/gh/p4veu/ttcc@${version}"
          echo "Checking immutable release URL: ${base}"
          for i in $(seq 1 60); do
            body="$(curl --fail --silent --show-error "${base}/package.json" || true)"
            echo "$body"
            script="$(curl --fail --silent --show-error "${base}/dist/userScript.v26-document-start.js" || true)"
            service="$(curl --fail --silent --show-error "${base}/dist/service.v26-document-start.js" || true)"
            if echo "$body" | grep -q '"main": "dist/userScript.v26-document-start.js"' && echo "$body" | grep -q '"serviceFile": "dist/service.v26-document-start.js"' && echo "$body" | grep -q '"version": "1.15.4"' && [[ "$script" == *standby-reload-wait* ]] && [[ "$script" == *focus-paused-detected* ]] && [[ "$script" == *pause-candidate* ]] && [[ "$script" != *startup-stale-session* ]] && [[ "$service" == *1.15.4* ]]; then
              echo "Pinned jsDelivr release is verified."
              exit 0
            fi
            echo "Pinned CDN URL not ready; retry $i/60..."
            sleep 5
          done
          echo "Pinned jsDelivr release did not return the expected .25 files."
          exit 1
